<div class="flex min-h-dvh flex-col justify-center bg-paper px-6 py-16">
  <div class="mx-auto flex w-full max-w-sm flex-col gap-8">
    <a routerLink="/" class="w-fit font-mono text-xs uppercase tracking-widest text-muted transition-colors hover:text-accent">&larr; Vista</a>

    <div class="flex flex-col gap-2 border-b border-rule pb-6">
      <h1 class="font-display text-3xl font-bold text-ink">Create an account</h1>
      <p class="font-body text-muted">Pseudo, email, password &mdash; confirm and you&rsquo;re in.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
      <label class="flex flex-col gap-1.5">
        <span class="font-mono text-xs uppercase tracking-widest text-muted">Pseudo</span>
        <input
          type="text"
          formControlName="pseudo"
          autocomplete="username"
          class="border border-rule bg-paper-2 px-3 py-2.5 text-ink outline-none transition-colors focus:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="font-mono text-xs uppercase tracking-widest text-muted">Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          class="border border-rule bg-paper-2 px-3 py-2.5 text-ink outline-none transition-colors focus:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="font-mono text-xs uppercase tracking-widest text-muted">Password</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          class="border border-rule bg-paper-2 px-3 py-2.5 text-ink outline-none transition-colors focus:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"
        />
      </label>

      @if (errorMessage()) {
        <p class="font-mono text-sm text-danger">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="form.invalid || submitting()"
        class="mt-2 inline-flex items-center justify-center gap-2 border border-accent bg-accent px-5 py-2.5 font-mono text-sm tracking-wide text-accent-ink transition hover:-translate-y-px hover:border-ink hover:bg-ink active:translate-y-0 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ submitting() ? 'Creating account…' : 'Register' }}
      </button>
    </form>

    <p class="font-mono text-sm text-muted">
      Already have an account?
      <a routerLink="/login" class="border-b border-rule text-ink transition-colors hover:border-accent hover:text-accent">Log in</a>
    </p>
  </div>
</div>
