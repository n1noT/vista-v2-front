<ul
  cdkDropList
  [cdkDropListDisabled]="readOnly()"
  (cdkDropListDropped)="drop($event)"
  class="flex flex-col divide-y divide-rule border-y border-rule"
>
  @for (team of teams(); track team.teamId; let i = $index) {
    <li
      cdkDrag
      [cdkDragDisabled]="readOnly()"
      [class]="readOnly() ? 'flex items-center gap-4 bg-paper py-3 pr-4' : 'flex items-center gap-4 bg-paper py-3 pr-4 cursor-grab active:cursor-grabbing'"
    >
      @if (!readOnly()) {
        <span
          class="flex w-9 shrink-0 items-center justify-center text-muted transition-colors"
          aria-hidden="true"
        >
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
            <circle cx="4" cy="2" r="1.4" />
            <circle cx="10" cy="2" r="1.4" />
            <circle cx="4" cy="7" r="1.4" />
            <circle cx="10" cy="7" r="1.4" />
            <circle cx="4" cy="12" r="1.4" />
            <circle cx="10" cy="12" r="1.4" />
          </svg>
        </span>
      } @else {
        <span class="w-9 shrink-0"></span>
      }

      <span class="w-6 shrink-0 font-mono text-sm text-muted tnum">{{ i + 1 }}</span>

      @if (team.logoUrl) {
        <img [src]="team.logoUrl" [alt]="team.name" class="h-6 w-6 shrink-0 object-contain" />
      } @else {
        <span class="h-6 w-6 shrink-0 border border-rule"></span>
      }

      <span class="font-body text-ink">{{ team.name }}</span>
    </li>
  }
</ul>
